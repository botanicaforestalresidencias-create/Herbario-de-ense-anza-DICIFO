<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Herbario de Enseñanza — Acceso</title>
  <link rel="stylesheet" href="css/style.css">

  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
  <link rel="shortcut icon" href="/assets/icon-192.png">

  <!-- PWA & Mobile Web App -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a1f11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Herbario DICIFO">
  <link rel="apple-touch-icon" href="assets/icon-192.png">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('PWA Service Worker registrado'))
          .catch((err) => console.error('Error en Service Worker:', err));
      });
    }
  </script>

<style>
    /* Estructura general integrada */
    html, body.login-viewport {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      background-color: #081a0e;
      font-family: var(--font-body, system-ui, -apple-system, sans-serif);
      overflow-x: hidden;
    }

    /* ENCABEZADO: Con presencia institucional firme y separación física */
    .app-header.header-integrated {
      background: linear-gradient(180deg, #11361f 0%, #0b2414 100%) !important;
      padding: 16px 32px !important;
      border-bottom: 4px solid var(--uach-gold, #b8860b) !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75), 0 2px 6px rgba(0, 0, 0, 0.4) !important;
      position: relative;
      z-index: 50;
    }

    .app-header.header-integrated .brand img {
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
    }

    .app-header.header-integrated h1 {
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      letter-spacing: 0.03em;
    }

    /* ESCENARIO: Iluminación central para contrastar contra el header */
    .login-stage-immersive {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #1c522e 0%, #0f301b 50%, #06150b 100%);
    }

    /* Halos orgánicos sutiles */
    .login-stage-immersive::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(17, 75, 126, 0.45) 0%, transparent 68%);
      border-radius: 50%;
      top: -100px;
      left: -120px;
      pointer-events: none;
    }

    .login-stage-immersive::after {
      content: '';
      position: absolute;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(184, 134, 11, 0.35) 0%, transparent 70%);
      border-radius: 50%;
      bottom: -100px;
      right: -100px;
      pointer-events: none;
    }

    .organic-shape-bg {
      position: absolute;
      width: 680px;
      height: 680px;
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 45% 55% 63% 37% / 40% 60% 40% 60%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: rotateOrganic 28s infinite linear;
    }

    @keyframes rotateOrganic {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* TARJETA BLANCA: Alto contraste y sombra nítida */
    .login-card-pro {
      width: 100%;
      max-width: 395px;
      background: #ffffff;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-top: 5px solid var(--dicifo-green, #1f5c34);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 8px 20px rgba(0, 0, 0, 0.3);
      padding: 24px 24px 20px;
      box-sizing: border-box;
      position: relative;
      z-index: 10;
      animation: cardAppear 0.35s ease-out;
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-logos-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .card-logos-row img {
      height: 44px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.08));
    }

    .card-logos-row .sep {
      width: 1px;
      height: 28px;
      background-color: #e2e8f0;
    }

    .card-header-block {
      text-align: center;
      margin-bottom: 18px;
    }

    .badge-sub {
      display: inline-block;
      font-family: var(--font-label, monospace);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--uach-blue, #114b7e);
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .card-header-block h2 {
      font-family: var(--font-display, Georgia, serif);
      font-size: 1.55rem;
      color: #0f172a;
      margin: 0 0 3px;
    }

    .card-header-block p {
      font-size: 12.5px;
      color: #64748b;
      margin: 0;
    }

    /* BOTÓN PRIMARIO: ALUMNOS */
    .student-hero-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px 16px;
      background: var(--dicifo-green-dark, #153e23) !important;
      color: #ffffff !important;
      font-size: 14.5px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(21, 62, 35, 0.35);
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .student-hero-btn:hover {
      background: #0d2716 !important;
      box-shadow: 0 6px 18px rgba(21, 62, 35, 0.45);
      transform: translateY(-1px);
    }

    .student-hero-btn span.icon {
      font-size: 18px;
    }

    /* SECCIÓN ENCARGADO */
    .admin-accordion-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 18px 0 12px;
      padding-top: 14px;
      border-top: 1px dashed #cbd5e1;
      color: #475569;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s;
    }

    .admin-accordion-toggle:hover {
      color: var(--uach-blue, #114b7e);
    }

    .field-block {
      margin-bottom: 12px;
    }

    .field-block label {
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 5px;
    }

    .input-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-box input {
      width: 100%;
      padding: 9px 36px 9px 11px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13.5px;
      background: #f8fafc;
      color: #0f172a;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .input-box input:focus {
      background: #ffffff;
      outline: none;
      border-color: var(--uach-blue, #114b7e);
      box-shadow: 0 0 0 3px rgba(17, 75, 126, 0.12);
    }

    .toggle-pass-btn {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: #64748b;
      padding: 3px;
    }

    .btn-admin-submit {
      width: 100%;
      padding: 9px;
      background: #ffffff;
      color: var(--uach-blue, #114b7e);
      border: 1.5px solid var(--uach-blue, #114b7e);
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 4px;
    }

    .btn-admin-submit:hover {
      background: var(--uach-blue, #114b7e);
      color: #ffffff;
    }

    .error-alert {
      color: #dc2626;
      font-size: 12px;
      margin-top: 8px;
      min-height: 16px;
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>
<body class="login-viewport">

  <!-- BARRA INSTITUCIONAL INTEGRADA -->
  <header class="app-header header-integrated">
    <div class="brand" style="display: flex; align-items: center; gap: 12px;">
      <img src="chapingo.png" alt="UACh" style="height: 45px; object-fit: contain;">
      <img src="forestales.png" alt="DICIFO" style="height: 45px; object-fit: contain;">
      <div>
        <h1 style="font-size: 1.1rem; margin: 0;">Herbario de Enseñanza — Botánica Forestal</h1>
        <span class="subtitle" style="font-size: 0.8rem; opacity: 0.9;">División de Ciencias Forestales | Universidad Autónoma Chapingo</span>
      </div>
    </div>
  </header>

  <!-- CONTENEDOR CON FONDO BOTÁNICO / CHAPINGO -->
  <div class="login-stage-immersive">
    <div class="organic-shape-bg"></div>

    <div class="login-card-pro">
      
      <!-- LOGOS INSTITUCIONALES EN LA TARJETA -->
      <div class="card-logos-row">
        <img src="chapingo.png" alt="Universidad Autónoma Chapingo">
        <div class="sep"></div>
        <img src="forestales.png" alt="División de Ciencias Forestales">
      </div>

      <div class="card-header-block">
       <span class="badge-sub"><h2>Catálogo Botánico</h2></span>
        <p>Consulta de ejemplares, pliegos y fichas descriptivas.</p>
      </div>

      <!-- BOTÓN PRINCIPAL PARA ALUMNOS Y DOCENTES -->
      <button type="button" id="guestLink" class="student-hero-btn">
        <span class="icon">🌿</span>
        <span>Entrar a Consulta (Alumnos y Docentes)</span>
      </button>

      <!-- ACCESO SECUNDARIO: ENCARGADOS / ADMIN -->
      <div class="admin-accordion-toggle" id="toggleAdminForm">
        <span>🔒 Acceso para encargados del herbario</span>
      </div>

      <div class="admin-panel" id="adminPanel">
        <form id="loginForm" autocomplete="off">
          <div class="field-block">
            <label for="usuario">Usuario encargado</label>
            <div class="input-box">
              <input type="text" id="usuario" autocomplete="off" placeholder="Clave administrativa" required>
            </div>
          </div>

          <div class="field-block">
            <label for="password">Contraseña</label>
            <div class="input-box">
              <input type="password" id="password" autocomplete="new-password" placeholder="••••••••" required>
              <button type="button" id="togglePasswordBtn" class="toggle-pass-btn" title="Mostrar u ocultar contraseña">👁️</button>
            </div>
          </div>

          <button type="submit" id="submitBtn" class="btn-admin-submit">
            Iniciar sesión como encargado
          </button>

          <div class="error-alert" id="errorMsg"></div>
        </form>
      </div>

    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
